name: GA tiles
on:
  push:
    branches: [sky-tiles]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build the latest run even if it is already deployed
        type: boolean
        default: false
concurrency:
  group: tiles-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - name: Diagnose the exit crash
        continue-on-error: true
        run: |
          sudo apt-get install -y -q gdb > /dev/null
          for f in tests/test_*.py; do rc=0; python -X faulthandler -I -m pytest -q "$f" > /dev/null 2>&1 || rc=$?; echo "$f: $rc"; done
          for m in "eccodes" "omfiles" "pyproj" "eccodes, omfiles" "eccodes, pyproj" "omfiles, pyproj" "eccodes, omfiles, pyproj"; do
            rc=0; python -I -c "import $m" || rc=$?; echo "import $m: $rc"
          done
          rc=0; python -X faulthandler -I -m pytest -q 2>&1 | tail -40 || rc=$?
          gdb -batch -ex run -ex bt --args python -I -m pytest -q 2>&1 | grep -v "Thread 0x\|^\[New Thread\|^\[Thread" | tail -80 || true
      - run: python -I -m pytest -q
      # Before the build: a broken upload fails in seconds. The deployed run is read from the bucket itself.
      - name: Check R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tools/r2.sh setup gfs
          tools/r2.sh pull "$RUNNER_TEMP/deployed" wind/v1/manifest.json
      - id: build
        run: >-
          python -I -m windtiles.build --out site --work "$RUNNER_TEMP/grib"
          --deployed "file://$RUNNER_TEMP/deployed/wind/v1/manifest.json" ${{ inputs.force && '--force' || '' }}
      - name: Upload the run
        if: steps.build.outputs.changed == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: tools/r2.sh upload site
  # GitHub turns off schedules of a public repository after 60 days without activity.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "[save] Keep the hourly schedule alive"
            git push
          fi
