name: GA tiles
on:
  push:
    branches: [r2]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build the latest run even if it is already deployed
        type: boolean
        default: false
concurrency:
  group: tiles
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - run: python -I -m pytest -q
      - id: build
        run: python -I -m windtiles.build --out site --work "$RUNNER_TEMP/grib" ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}
      # Run folders are new, so the app sees a run only when the manifest arrives, after all its tiles.
      - name: Upload the run
        if: steps.build.outputs.changed == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://55cc1ebb03c9f23942476a22279e6df0.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rclone
          rclone copy site r2:ga-tiles --include '*.png' --no-check-dest --s3-no-check-bucket --transfers 32 --stats 60s --header-upload 'Cache-Control: public, max-age=31536000, immutable'
          rclone copy site r2:ga-tiles --include '*.json' --no-check-dest --s3-no-check-bucket --header-upload 'Cache-Control: public, max-age=60'
  # GitHub turns off schedules of a public repository after 60 days without activity.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "[save] Keep the hourly schedule alive"
            git push
          fi
